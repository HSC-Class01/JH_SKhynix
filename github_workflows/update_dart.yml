name: Update SK hynix DART data

on:
  workflow_dispatch:
  schedule:
    # Run daily at 00:30 KST; the date guard below executes the update only on KST day 1.
    - cron: '30 15 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Korean date
        id: date
        run: |
          DAY=$(TZ=Asia/Seoul date +%d)
          if [ "$DAY" = "01" ]; then echo "is_first=true" >> "$GITHUB_OUTPUT"; else echo "is_first=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Python
        if: steps.date.outputs.is_first == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.date.outputs.is_first == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Collect DART financial data
        if: steps.date.outputs.is_first == 'true' || github.event_name == 'workflow_dispatch'
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python src/collect.py

      - name: Calculate financial metrics
        if: steps.date.outputs.is_first == 'true' || github.event_name == 'workflow_dispatch'
        run: python src/analyze.py

      - name: Commit updated data
        if: steps.date.outputs.is_first == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m "chore: update DART financial data"
          git push
