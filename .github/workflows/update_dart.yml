name: SK hynix DART dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 매월 1일 00:15 UTC (한국시간 09:15)
    - cron: "15 0 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Data collection can take several minutes; fetch full history so
          # we can rebase generated data on changes made during the run.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check OpenDART API key
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        run: |
          if [ -z "$OPENDART_API_KEY" ]; then
            echo "Add OPENDART_API_KEY in Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
      - name: Collect OpenDART statements
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
        run: python -m src.collect
      - name: Calculate financial metrics
        run: python -m src.analyze
      - name: Build dashboard data
        run: python -m src.dashboard
      - name: Commit refreshed data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/dashboard-data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh SK hynix DART data"

            # main may have changed while OpenDART data was being collected.
            # Rebase the generated-data commit onto the newest main, then push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "Rebase failed; generated data could not be safely integrated." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying against latest main..."
            done

            echo "Unable to push refreshed data after 3 attempts." >&2
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
